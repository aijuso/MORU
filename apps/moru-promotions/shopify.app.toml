# MORU Promotions — MORU LIVING の販促・割引用 Shopify Functions をまとめる内部アプリ
#
# Function ごとにアプリを作らず、このアプリ配下に Extension として並べる方針(Owner 決定)。
# 想定: multi-buy / quantity discount, pair・set discount, seasonal sale 等
#
# `client_id` は Owner が Dev Dashboard で作成した "MORU Promotions" アプリのもの
# (2026-08-24 受領)。秘密情報ではない。これが入っているので対話式の
# `shopify app config link` は不要で、`shopify app deploy` を直接叩ける。
#
# このディレクトリはテーマ(リポジトリ直下)とは独立している。
# `shopify theme *` はここを見ない。

client_id = "7e71fcf4cf775c9c2568b1783bed5cfc"
name = "MORU Promotions"
application_url = "https://example.com"
embedded = false

[access_scopes]
# 最小権限。増やすときは理由を README に書く。
#
#   write_discounts — Function を割引として登録し、のちに Automatic Discount を作るのに必要。
#                     read_discounts は write に含まれる
#   read_products   — input query が Product の merchant-owned metafield
#                     `custom.multi_buy_eligible` を読むため
#
# 付けていないもの(要らない): write_products / read_orders / read_customers /
# read_inventory / write_themes / network access
scopes = "read_products,write_discounts"

# Function の設定 JSON を入れる metafield の定義。
# **アプリ予約名前空間 `$app` の下に置く。**Function の input query が
# `metafield(namespace: "$app", key: "function-configuration")` で読むのはこれ。
#
# ⚠️ `$app` はこのアプリ専用の名前空間なので、**他のアプリからは書き込めない。**
# したがって Discount の作成(= この metafield への書き込み)は、
# **MORU Promotions アプリ自身の Admin API アクセストークン**で行う必要がある。
# 別アプリ(Claude の MCP 等)の権限では書けない。
[discount.metafields.app.function-configuration]
type = "json"
name = "Function configuration"
access.admin = "merchant_read_write"
access.storefront = "none"

[auth]
redirect_urls = [ "https://example.com/auth/callback" ]

[webhooks]
api_version = "2025-10"

[build]
