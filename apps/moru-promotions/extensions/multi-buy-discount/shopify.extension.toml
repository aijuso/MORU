api_version = "2025-10"

[[extensions]]
name = "MORU まとめ買い割引"
handle = "moru-multi-buy-discount"
uid = "a475e5e4-1bfc-6e0c-1036-c65f32d3a9cca5956889"
type = "function"
description = "同一 Product の合計数量が2点で10%OFF / 3点以上で15%OFF。対象は Product metafield custom.multi_buy_eligible が true の商品のみ。"

  [[extensions.targeting]]
  target = "cart.lines.discounts.generate.run"
  input_query = "src/cart_lines_discounts_generate_run.graphql"
  # Wasm Component Model の制約で TOML の export は kebab-case。
  # JS 側の camelCase export(cartLinesDiscountsGenerateRun)は CLI が自動で対応づける。
  export = "cart-lines-discounts-generate-run"

  [extensions.build]
  # JS Function は Shopify CLI(Javy)が直接ビルドする。独自の build command は不要。
  # ここに "npm run build" を書くと package.json の build が
  # `shopify app function build` を呼び返して無限再帰し、ビルドが永久にハングする。
  command = ""
  # この Function は `generated/api` を import せず、GraphQL 生成型に依存しない
  # (README 参照)。CLI は JS ビルド時に必ず typegen を走らせようとするので、
  # no-op コマンドを明示して graphql-code-generator の実行を止める。
  typegen_command = "true"
  path = "dist/function.wasm"
  watch = [ "src/**/*.js", "src/**/*.graphql" ]
