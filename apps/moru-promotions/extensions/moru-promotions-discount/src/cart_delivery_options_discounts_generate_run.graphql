query Input {
  cart {
    lines {
      quantity
      cost { amountPerQuantity { amount } }
      merchandise { __typename ... on ProductVariant { id product { id } } }
    }
    # 配送オプションは title で許可判定する(D-146)。
    # 未知の配送方法を自動的に無料にしないため、group 単位ではなく option 単位で当てる。
    deliveryGroups {
      deliveryOptions { handle title }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app", key: "function-configuration") { jsonValue }
  }
  # $app はこのアプリ専用なので、アプリ自身のトークンが無いと書けない。
  # 管理画面から Discount を作る運用でも設定を入れられるように、
  # マーチャント所有の shop metafield をフォールバックとして読む(D-138)。
  shop {
    metafield(namespace: "custom", key: "moru_promotions_config") { jsonValue }
  }
}
